##
## One property, deliberately.
##
## liferay.workspace.product drives app.server.tomcat.version, liferay.workspace.bundle.url,
## liferay.workspace.docker.image.liferay and liferay.workspace.target.platform.version, so
## setting any of those by hand here would only create a way for them to disagree.
##
## portal-7.4-ga132 and not a dxp-* product: the matching Docker image is public, and
## Example Bank has to be runnable by a prospect who has signed nothing. The client
## extension contract is identical on DXP — see README.md.
##
liferay.workspace.product=portal-7.4-ga132
