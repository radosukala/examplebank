# For anyone who wants to see a client extension actually deploy. Nothing in the
# recorded demo depends on this container booting — a live portal on camera is a
# liability, and the Change Pack has to verify without one anyway.
#
#   docker compose up -d
#   open http://localhost:8080     test@liferay.com / test
#
# Then either drop a built LUFFA zip into ./liferay/deploy, or from this directory:
#   ../../gradlew clean deploy -Ddeploy.docker.container.id=examplebank-liferay
name: examplebank-liferay

services:
    liferay:
        container_name: examplebank-liferay
        environment:
            LIFERAY_JVM_OPTS: -Xms4g -Xmx4g
        healthcheck:
            interval: 10s
            retries: 60
            start_period: 40s
            test: >
                curl
                --fail
                --silent
                http://localhost:8080/c/portal/status
            timeout: 10s
        image: liferay/portal:7.4.3.132-ga132
        mem_limit: 8g
        ports:
            -   8080:8080
        volumes:
            # The container symlinks /mnt/liferay/deploy to [Liferay Home]/deploy, so
            # anything landing in ./liferay/deploy is auto-deployed.
            -   ./liferay:/mnt/liferay
