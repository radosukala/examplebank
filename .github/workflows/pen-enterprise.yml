# The gate.
#
# A CLI refusal is bypassed by not running the CLI. This check is REQUIRED on main,
# so the merge button is disabled by GitHub rather than by a tool someone can skip.
#
#   Settings → Rules → Rulesets → Require status checks to pass
#   → "Bindings resolve against the catalog"
#
# Notes for whoever reviews this before enabling it somewhere real:
#
#   - No third-party actions. Only actions/checkout, actions/setup-node and
#     actions/upload-artifact — all first-party. A governance check that pulls an
#     unpinned action off the marketplace is not a governance check.
#   - No secret is required to BLOCK. PEN_RECEIPT_KEY_PEM only signs the receipt
#     for a change that already passed, so a fork PR without secrets is still gated.
#   - The tool writes nothing. Every file produced below comes from a redirect in
#     this workflow, where you can read it.
#   - This repository VENDORS the tool under .pen-enterprise/ because the package
#     is not published yet. Once it is, all three invocations collapse to
#     `npx --yes @pen-enterprise/verify@<tag> pen-enterprise-ci`. Pin a tag either
#     way: a governance check floating on @latest is a supply chain, not a control.
name: pen.dev Enterprise

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Only so the check can leave ONE comment pointing at the preview. It grants no
  # ability to approve, merge or change a review — and the merge is blocked by the
  # branch ruleset, never by anything this token can reach.
  pull-requests: write

jobs:
  bindings:
    name: Bindings resolve against the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check resolves the whole profile, not the diff — but naming the
          # touched files in the report needs both sides of the comparison.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the vendored resolver
        run: npm install --prefix .pen-enterprise --omit=dev --no-audit --no-fund

      - name: List the governed files this pull request touches
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          cat changed.txt

      - name: Evidence
        if: always()
        env:
          PEN_RECEIPT_KEY_PEM: ${{ secrets.PEN_RECEIPT_KEY_PEM }}
        run: |
          touch changed.txt
          node .pen-enterprise/verify/dist/ci.js --root . --changed-from changed.txt \
            --summary >> "$GITHUB_STEP_SUMMARY"
          node .pen-enterprise/verify/dist/ci.js --root . --changed-from changed.txt \
            --evidence > evidence.json

      # The YES, not just the NO. One HTML file that opens with a double-click:
      # the approved bundle inlined verbatim, its answers taken from this
      # repository's own declared examples, nothing fetched. A reviewer downloads
      # it and looks at the screen before approving it — no portal, no VPN.
      #
      # Absent when the change is refused, and that is the invariant, not a gap:
      # a blocked merge has no bundle, so there is nothing honest to preview.
      - name: The preview a reviewer clicks
        if: always()
        run: |
          node .pen-enterprise/verify/dist/cli.js export --root . --file preview.html \
            > preview.html || rm -f preview.html

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pen-enterprise-evidence
          path: |
            evidence.json
            preview.html
          if-no-files-found: ignore

      # One comment, edited in place, so a long review is not a wall of bot noise.
      # `gh` ships on the runner, so this stays inside the no-third-party-actions
      # rule above.
      - name: Leave the reviewer a way in
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- pen-enterprise -->"
            if [ -f preview.html ]; then
              echo "**The screen this change produces** is attached to [the run]($RUN) as"
              echo "\`pen-enterprise-evidence\` → \`preview.html\`. Download it and open it — no"
              echo "server, no VPN, nothing fetched. It inlines the bundle that deploys byte for"
              echo "byte, and the digest is in the receipt beside it."
            else
              echo "**No preview:** this change is refused, so there is no bundle to show."
              echo "The job summary names what was refused and who can approve it."
            fi
          } > comment.md
          # Never fatal. A pull request from a fork gets a read-only token, and a
          # governance check that goes red because it could not leave a comment
          # has failed for a reason that has nothing to do with the bindings.
          gh pr comment "${{ github.event.number }}" --edit-last --body-file comment.md \
            || gh pr comment "${{ github.event.number }}" --body-file comment.md \
            || echo "could not comment — the preview is still attached to the run."

      # Optional, and it holds nothing. We render a Block Kit payload; YOUR
      # incoming webhook posts it. No bot token, no OAuth grant, no listener,
      # nothing of ours in your workspace.
      #
      # Add SLACK_WEBHOOK_URL as a repository secret to switch it on. Without it
      # the payload is printed here and nothing is sent, so the feature degrades
      # into something readable rather than into a failure.
      - name: Post the decision to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node .pen-enterprise/verify/dist/ci.js --root . --slack > slack.json
          cat slack.json
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data @slack.json "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL is not set — payload printed above, nothing posted."
          fi

      # Last, and the only step that can fail. The reporting above runs with
      # `if: always()` so a red check still explains itself — if the report were
      # the failing step, the explanation would be the thing that went missing.
      - name: Resolve every element against the catalog
        env:
          PEN_RECEIPT_KEY_PEM: ${{ secrets.PEN_RECEIPT_KEY_PEM }}
        run: |
          node .pen-enterprise/verify/dist/ci.js --root . --changed-from changed.txt
