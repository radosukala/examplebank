# The bank's OWN service catalog — a Backstage export, unmodified in shape.
#
# We do not author this, host it, or need write access to it. It is read, hashed,
# and the hash is pinned into every receipt, so a decision can always say which
# revision of the rules it applied.
#
# In a pilot this is the customer's real catalog-info.yaml or a JSON dump of
# `GET /api/catalog/entities` — the second is usually the faster path through a
# security review, because it needs no repository access at all.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: cards-valid-for-user
  namespace: default
  description: >-
    Valid, non-expired cards for the authenticated user. The channel-safe
    projection — this is what a dashboard tile is permitted to call.
  tags: [rest, bff, pci]
spec:
  type: openapi
  lifecycle: production
  owner: group:cards-platform
  system: cards
  # Backstage requires spec.definition on kind: API, and resolves $text against the
  # location of this file. Our loader ignores the field — it reads kind, lifecycle and
  # owner — but leaving it out would make the fixture invalid Backstage, and an
  # architect notices that before he notices anything we built.
  definition:
    $text: ../apis/cards-valid-for-user.openapi.yaml
---
# The general core-banking API. It is real, it is catalogued, and a customer-facing
# channel may not call it — which is the verdict people underestimate. This is not
# shadow IT; it is a sanctioned service used somewhere it was never sanctioned for.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: cards-core
  namespace: default
  description: Core banking card master. Internal systems only.
  tags: [rest, core, pci]
  annotations:
    # Backstage has no standard "this replaced that" field, so the catalog names
    # its own successor. A refusal then STATES the route to yes instead of
    # guessing, and the platform team corrects it by editing a file they own.
    pen.dev/superseded-by: api:default/cards-valid-for-user
spec:
  type: openapi
  lifecycle: deprecated
  owner: group:cards-platform
  system: cards
  definition:
    $text: ../apis/cards-core.openapi.yaml
